version: 2.1

jobs:
  build-apk:
    machine:
      image: android:2024.11.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Verify Android toolchain
          command: |
            java -version
            sdkmanager --version
            sdkmanager --list | grep -E 'platforms;android-35|build-tools;35.0.0' | head -20
      - run:
          name: Static + runtime release QA
          command: |
            node --version
            python3 tools/verify_release.py
      - restore_cache:
          keys:
            - magnet-gradle-v1-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}
            - magnet-gradle-v1-
      - run:
          name: Build debug APK
          working_directory: android
          command: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - save_cache:
          key: magnet-gradle-v1-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Verify APK artifact
          command: |
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            test -s "$APK"
            # Extract to a file instead of piping (CircleCI runs bash -eo pipefail; grep -q + pipe causes false failures)
            rm -rf /tmp/apkcheck && mkdir -p /tmp/apkcheck
            unzip -l "$APK" > /tmp/apkcheck/list.txt
            unzip -o -q "$APK" assets/index.html -d /tmp/apkcheck || { echo "APK is missing assets/index.html"; grep -i asset /tmp/apkcheck/list.txt || true; exit 1; }
            cmp /tmp/apkcheck/assets/index.html web/index.html || { echo "APK game asset differs from web/index.html"; exit 1; }
            echo "APK contains assets/index.html identical to web/index.html"
            unzip -o -q "$APK" 'classes*.dex' -d /tmp/apkcheck
            for cls in com/magnet/game/MainActivity com/magnet/game/MagnetApp; do
              grep -a -q -l "$cls" /tmp/apkcheck/classes*.dex || { echo "APK dex is missing $cls"; exit 1; }
            done
            echo "APK dex contains MainActivity and MagnetApp"
            AAPT2=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 2>/dev/null | tail -1)
            if [ -n "$AAPT2" ]; then "$AAPT2" dump badging "$APK" > /tmp/apkcheck/badging.txt || true; head -20 /tmp/apkcheck/badging.txt || true; fi
            sha256sum "$APK"
      - store_artifacts:
          path: android/app/build/outputs/apk/debug/app-debug.apk
          destination: MAGNET-debug.apk
      - run:
          name: Build signed release AAB (only when upload key env vars are set)
          working_directory: android
          command: |
            if [ -z "${MAGNET_UPLOAD_KEYSTORE_B64:-}" ] || [ -z "${MAGNET_UPLOAD_STORE_PASSWORD:-}" ] || [ -z "${MAGNET_UPLOAD_KEY_ALIAS:-}" ] || [ -z "${MAGNET_UPLOAD_KEY_PASSWORD:-}" ]; then
              echo "Upload key env vars not set in CircleCI project settings; skipping release AAB (see RELEASE_SIGNING.md)."
              mkdir -p app/build/outputs/bundle/release && echo "Release AAB skipped: upload key not configured. See RELEASE_SIGNING.md" > app/build/outputs/bundle/release/README.txt
              exit 0
            fi
            echo "$MAGNET_UPLOAD_KEYSTORE_B64" | base64 -d > /tmp/magnet-upload.jks
            export MAGNET_UPLOAD_STORE_FILE=/tmp/magnet-upload.jks
            ./gradlew --no-daemon --stacktrace :app:bundleRelease
            AAB=app/build/outputs/bundle/release/app-release.aab
            test -s "$AAB"
            # Must be signed with the upload key, not the debug key
            jarsigner -verify -verbose -certs "$AAB" > /tmp/aab-verify.txt 2>&1 || { cat /tmp/aab-verify.txt; exit 1; }
            if grep -q "CN=MAGNET Debug" /tmp/aab-verify.txt; then echo "AAB is signed with the DEBUG key"; exit 1; fi
            sha256sum "$AAB"
            rm -f /tmp/magnet-upload.jks
      - store_artifacts:
          path: android/app/build/outputs/bundle/release
          destination: release

workflows:
  build:
    jobs:
      - build-apk
