plugins { id 'com.android.application' }

def localReleaseProps = new Properties()
def localReleaseFile = rootProject.file('keystore.properties')
if (localReleaseFile.exists()) localReleaseFile.withInputStream { localReleaseProps.load(it) }
ext.releaseProp = { String key -> System.getenv(key) ?: localReleaseProps.getProperty(key) }
ext.releaseSigningAvailable = ['MAGNET_UPLOAD_STORE_FILE', 'MAGNET_UPLOAD_STORE_PASSWORD', 'MAGNET_UPLOAD_KEY_ALIAS', 'MAGNET_UPLOAD_KEY_PASSWORD']
        .every { releaseProp(it) } && file(releaseProp('MAGNET_UPLOAD_STORE_FILE')).exists()

android {
    namespace 'com.magnet.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.magnet.game'
        minSdk 23
        targetSdk 35
        versionCode 55
        versionName '6.2.0'
    }

    signingConfigs {
        // Fixed, committed DEBUG key so every CircleCI/Termux debug APK installs over the previous one
        // (CI machines otherwise generate a new random debug key per build). Never use for Play releases.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Play upload key: never committed. Provided by CircleCI env vars (see RELEASE_SIGNING.md)
        // or by android/keystore.properties for local Termux builds.
        if (releaseSigningAvailable) {
            release {
                storeFile file(releaseProp('MAGNET_UPLOAD_STORE_FILE'))
                storePassword releaseProp('MAGNET_UPLOAD_STORE_PASSWORD')
                keyAlias releaseProp('MAGNET_UPLOAD_KEY_ALIAS')
                keyPassword releaseProp('MAGNET_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            if (releaseSigningAvailable) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    // Google Play in-app review (dialog shown by the Play Store app; the game never sees the rating or text)
    implementation 'com.google.android.play:review:2.0.2'
}
